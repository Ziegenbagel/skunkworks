[project]
name = "skunkworks"
version = "0.7.0"
description = "Policy-controlled mission control and fleet automation for the Von Neumann Game"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyside6>=6.11.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "keyring>=25.6.0",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
]
